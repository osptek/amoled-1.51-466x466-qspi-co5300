copy:
  slogan_zh: 圆形 AMOLED 模组 · QSPI · CO5300
  slogan_en: Round AMOLED module · QSPI · CO5300
  intro_zh: OSPTEK **1.51 寸 466×466 AMOLED** 是一款 **QSPI** 接口彩色显示模组，显示驱动为 **CO5300**，触摸驱动为 **CST820**。适合穿戴表盘、圆形仪表与小型圆形 HMI 等场景。
  intro_en: OSPTEK **1.51″ 466×466 AMOLED** is a **QSPI** color display module driven by **CO5300**, with capacitive touch (**CST820**). Suited to wearables, round gauges, and compact round HMI.
  version_note_zh: 当前模组版本：**AM151Q466466LK**。电气与外形细节以 [`docs/AM_151_Q466466_LK_7e8bc9aaa3.pdf`](./docs/AM_151_Q466466_LK_7e8bc9aaa3.pdf) 为准。
  version_note_en: 'Current module version: **AM151Q466466LK**. Electrical and mechanical details follow [`docs/AM_151_Q466466_LK_7e8bc9aaa3.pdf`](./docs/AM_151_Q466466_LK_7e8bc9aaa3.pdf).'
  panel_type_zh: AMOLED（彩色，圆形）
  panel_type_en: AMOLED (color, round)
  spec_note_zh: 完整外形尺寸、FPC 定义、供电与时序以产品规格书 / 驱动手册为准。
  spec_note_en: Full outline, FPC definition, power, and timing follow the product datasheet / driver IC datasheet.
  nav_note_zh: 带触摸（CST820）。
  nav_note_en: With touch (CST820).
